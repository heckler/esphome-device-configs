# -----------------------------------------------------------------------------
# ESPHome config file for the ESP32-S3 module 01
# CAH 2026-10-13
#
#
# -----------------------------------------------------------------------------

substitutions:
  node_hostname: esp32s3_01
  node_name: "ESP32-S3 01"

packages:
  device_base: !include common/device_base.yaml
  platform: !include common/esp32s3.yaml


# SPI bus for the WeAct e-paper display: https://esphome.io/components/spi/
spi:
  id: spi_bus_weact
  clk_pin: GPIO6
  mosi_pin: GPIO7


# I2C bus for the BME280 and SCD41 sensors: https://esphome.io/components/i2c/
i2c:
  id: i2c_bus_sensors
  sda: GPIO4
  scl: GPIO5
  scan: True
  frequency: 100kHz


# SCD41 sensor: https://esphome.io/components/sensor/scd4x/
sensor:
  - platform: scd4x
    i2c_id: i2c_bus_sensors
    address: 0x62
    measurement_mode: periodic  #low_power_periodic
    update_interval: 5s
    temperature_offset: 0
    automatic_self_calibration: false
    co2:
      name: "${node_name} Internal CO2"
    temperature:
      name: "${node_name} Internal Temperature"
    humidity:
      name: "${node_name} Internal Humidity"


# BME280 sensor: https://esphome.io/components/sensor/bme280/
  - platform: bme280_i2c
    i2c_id: i2c_bus_sensors
    address: 0x76
    temperature:
      name: "${node_name} External Temperature"
    pressure:
      name: "${node_name} External Pressure"
    humidity:
      name: "${node_name} External Humidity"

http_request:
  verify_ssl: false
  timeout: 15s

image:
  - platform: online_image
    id: remote_image
    url: http://homeassistant.local:8123/local/epaper/screen.png
    format: PNG
    type: RGB
    resize: 400x300
    on_download_finished:
      - component.update: epaper

display:
  - platform: epaper_spi
    id: epaper
    spi_id: spi_bus_weact
    model: WeAct-4.2in-3c
    cs_pin: GPIO8
    dc_pin: GPIO9
    reset_pin: GPIO10
    busy_pin: GPIO11
    update_interval: never
    lambda: |-
      it.fill(Color::WHITE);
      it.image(0, 0, id(remote_image));

text:
  - platform: template
    name: "E-Paper Image URL"
    id: image_url
    mode: text
    optimistic: true
    min_length: 1
    max_length: 255
    set_action:
      - online_image.set_url:
          id: remote_image
          url: !lambda 'return x;'